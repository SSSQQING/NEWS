[package]
name = "qingtu-ssimulacra2"
version = "0.1.0"
edition = "2021"
publish = false
description = "SSIMULACRA 2 (rust-av/ssimulacra2) compiled to WebAssembly for Qingtu"

[lib]
crate-type = ["cdylib"]

[dependencies]
ssimulacra2 = { version = "=0.5.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
